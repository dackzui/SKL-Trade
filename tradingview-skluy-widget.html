<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKLUY TradingView Widget</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0F0F0F;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      width: 100%;
      height: 100vh;
      padding: 0;
      margin: 0;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: calc(100% - 32px);
    }

    .tradingview-widget-copyright {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      background: #0F0F0F;
    }

    .tradingview-widget-copyright a {
      color: #4da3ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">

      <div class="tradingview-widget-container__widget"></div>

      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/symbols/OTC-SKLUY/" target="_blank" rel="noopener">
          SKLUY Quote by TradingView
        </a>
      </div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
        async>
      {
        "lineWidth": 2,
        "lineType": 0,
        "chartType": "area",
        "fontColor": "rgb(106, 109, 120)",
        "gridLineColor": "rgba(242, 242, 242, 0.06)",
        "volumeUpColor": "rgba(34, 171, 148, 0.5)",
        "volumeDownColor": "rgba(247, 82, 95, 0.5)",
        "backgroundColor": "#0F0F0F",
        "widgetFontColor": "#DBDBDB",
        "upColor": "#22ab94",
        "downColor": "#f7525f",
        "borderUpColor": "#22ab94",
        "borderDownColor": "#f7525f",
        "wickUpColor": "#22ab94",
        "wickDownColor": "#f7525f",
        "colorTheme": "dark",
        "isTransparent": false,
        "locale": "en",
        "chartOnly": false,
        "scalePosition": "right",
        "scaleMode": "Normal",
        "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif",
        "valuesTracking": "1",
        "changeMode": "price-and-percent",
        "symbols": [
          [
            "OTC:SKLUY|1D"
          ]
        ],
        "dateRanges": [
          "1d|1",
          "1m|30",
          "3m|60",
          "12m|1D",
          "60m|1W",
          "all|1M"
        ],
        "fontSize": "10",
        "headerFontSize": "medium",
        "autosize": true,
        "width": "100%",
        "height": "100%",
        "noTimeScale": false,
        "hideDateRanges": false,
        "hideMarketStatus": false,
        "hideSymbolLogo": false
      }
      </script>

    </div>
    <!-- TradingView Widget END -->

  </div>

</body>
</html>
